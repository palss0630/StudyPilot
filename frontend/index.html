<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyPilot — Autonomous AI Study & Research Agent</title>
    <meta name="description" content="Autonomous AI study and research agent powered by multi-step tool reasoning, reflection, interactive quizzes, and flashcards." />
    <meta name="theme-color" content="#020617" />
    
    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        overflow: hidden;
      }
      /* Smooth animated loading splash screen */
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #0f172a 0%, #020617 100%);
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(99, 102, 241, 0.35);
        animation: pulseLogo 2s infinite ease-in-out;
      }
      .splash-logo svg {
        width: 34px;
        height: 34px;
        fill: none;
        stroke: white;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .splash-title {
        margin-top: 20px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-subtitle {
        margin-top: 6px;
        font-size: 13px;
        color: #94a3b8;
        letter-spacing: 0.02em;
      }
      .splash-loader {
        margin-top: 32px;
        width: 140px;
        height: 3px;
        background: rgba(148, 163, 184, 0.15);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .splash-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -100%;
        width: 100%;
        background: linear-gradient(90deg, #6366f1, #a855f7);
        border-radius: 9999px;
        animation: loadingBar 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(99, 102, 241, 0.3); }
        50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(124, 58, 237, 0.5); }
      }
      @keyframes loadingBar {
        0% { left: -100%; width: 50%; }
        50% { left: 25%; width: 75%; }
        100% { left: 100%; width: 50%; }
      }
    </style>
  </head>
  <body>
    <!-- Premium Splash Screen until React hydrates -->
    <div id="initial-splash">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
          <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </svg>
      </div>
      <div class="splash-title">StudyPilot</div>
      <div class="splash-subtitle">Autonomous AI Study & Research Agent</div>
      <div class="splash-loader">
        <div class="splash-bar"></div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Gracefully fade out splash screen as soon as React initializes
      window.addEventListener('DOMContentLoaded', () => {
        const splash = document.getElementById('initial-splash');
        if (splash) {
          setTimeout(() => {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(() => splash.remove(), 400);
          }, 350);
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
